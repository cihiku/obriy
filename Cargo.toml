[package]
name = "obriy"
version.workspace = true
edition.workspace = true

[workspace]
resolver = "3"
members = []

[workspace.package]
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", features = ["wayland"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
